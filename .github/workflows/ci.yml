name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The browser tests in `pnpm test` run in these.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Lint
        run: pnpm run lint
      - name: Type-check
        run: pnpm run typecheck
      # Builds dist/, runs the Node tests on it and the browser tests on the sources, then the type fixtures on dist/.
      - name: Test
        run: pnpm run test
      # Builds the package again, installs it into test/site with that site's lockfile, builds the site, and drives its
      # pages in Chromium on the preview and on the dev server.
      - name: Test example site
        run: pnpm run test:site
      - name: Publint
        run: pnpm exec publint
      # actionlint's action downloads a Linux binary.
      - name: Lint workflows
        if: runner.os == 'Linux'
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # The example site on the lowest versions the peer ranges allow. Vue's floor is the one VitePress 1.6.0 depends on, and
  # no 4.0.0 of Chart.js was published. `pnpm test:site` installs the site frozen, so this job installs and runs it
  # itself.
  lowest-peers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
      # Adding the versions rewrites the site's package.json and lockfile in the checkout only, and installs the package
      # just built.
      - name: Install the example site with the lowest peers
        run: pnpm --dir test/site add chart.js@4.0.1 vitepress@1.6.0 vue@3.5.13
      # A site that silently kept its lockfile's versions would prove nothing.
      - name: Check the installed versions
        working-directory: test/site
        run: |
          node --input-type=module --eval "
            import { readFileSync } from 'node:fs'
            const expected = { 'chart.js': '4.0.1', vitepress: '1.6.0', vue: '3.5.13' }
            for (const [name, version] of Object.entries(expected)) {
              // Read as a file: chart.js does not export its package.json.
              const found = JSON.parse(readFileSync('node_modules/' + name + '/package.json', 'utf8')).version
              console.log(name, found)
              if (found !== version) throw new Error(name + ' is ' + found + ', not ' + version)
            }
          "
      - name: Test example site
        run: pnpm exec vitest run --config vitest.site.config.ts
